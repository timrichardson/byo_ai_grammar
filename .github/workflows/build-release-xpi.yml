name: Build Release XPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to attach the XPI to, for example v0.2.0
        required: false
        type: string
      upload_to_release:
        description: Attach the XPI to the selected GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-xpi:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installable XPI
        run: npm run package

      - name: Capture XPI filename
        id: package
        shell: bash
        run: |
          XPI_PATH="$(ls -1 *.xpi | head -n 1)"
          echo "xpi_path=$XPI_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mozilla-byo-ai-grammar-xpi
          path: ${{ steps.package.outputs.xpi_path }}

      - name: Attach XPI to GitHub Release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          XPI_PATH: ${{ steps.package.outputs.xpi_path }}
        shell: bash
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "release_tag is required when upload_to_release is true" >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" "$XPI_PATH" --clobber
